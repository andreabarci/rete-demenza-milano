<html lang="it">
<head>

<link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
<style>
:root {
  --c-sanitario:      #1B5E8C;
  --c-sociosanitario: #3D9E72;
  --c-sociale:        #C4622D;
  --c-locale:         #7B5EA7;
  --bg:               #F5F3EE;
  --surface:          #FFFFFF;
  --text-primary:     #1A1A1A;
  --text-secondary:   #6B6760;
  --text-tertiary:    #9E9B96;
  --border:           rgba(0,0,0,0.08);
  --border-strong:    rgba(0,0,0,0.14);
  --shadow-lg:        0 20px 60px rgba(0,0,0,0.18);
  --radius-sm:        8px;
  --radius-md:        14px;
  --font-display:     'Instrument Serif', serif;
  --font-body:        'DM Sans', sans-serif;
  --font-mono:        'DM Mono', monospace;
  --bar-h:            64px;
  --transition:       0.26s cubic-bezier(0.4,0,0.2,1);
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; width:100%; overflow:hidden; font-family:var(--font-body); background:var(--bg); color:var(--text-primary); }

/* ── MAP ── */
#map { position:fixed; inset:0; top:var(--bar-h); }

/* ── TOP BAR ── */
#topbar {
  position:fixed; top:0; left:0; right:0; height:var(--bar-h); z-index:200;
  background:rgba(245,243,238,0.97); backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border-strong);
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
}
#bar-left {
  padding:0 20px; display:flex; flex-direction:column; gap:3px;
  border-right:1px solid var(--border); height:100%; justify-content:center;
}
.bar-name { font-family:var(--font-display); font-size:15px; font-style:italic; color:var(--text-primary); letter-spacing:-0.01em; line-height:1.15; }
.bar-meta { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.bar-count { font-family:var(--font-mono); font-size:10.5px; color:var(--text-secondary); letter-spacing:0.03em; }
.bar-link { font-family:var(--font-mono); font-size:10.5px; color:var(--text-tertiary); letter-spacing:0.04em; text-decoration:none; border-bottom:1px solid transparent; transition:color var(--transition), border-color var(--transition); cursor:pointer; background:none; border-top:none; border-left:none; border-right:none; font:inherit; }
.bar-link:hover { color:var(--text-primary); border-bottom-color:var(--text-primary); }
.bar-sep { width:1px; height:10px; background:var(--border-strong); flex-shrink:0; }

#bar-center {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:4px; padding:0 28px; height:100%;
}
.percorso-select-wrapper { position:relative; width:340px; }
#percorso-select {
  width:100%; appearance:none; -webkit-appearance:none;
  background:var(--surface); border:1px solid var(--border-strong);
  border-radius:100px; padding:7px 32px 7px 16px;
  font-family:var(--font-body); font-size:12.5px; font-weight:500;
  color:var(--text-primary); cursor:pointer; outline:none;
  transition:border-color var(--transition), box-shadow var(--transition);
  text-align:center;
}
#percorso-select:focus { border-color:#9E9B96; box-shadow:0 0 0 3px rgba(0,0,0,0.06); }
.select-chevron { position:absolute; right:12px; top:50%; transform:translateY(-50%); pointer-events:none; color:var(--text-tertiary); }
#bar-count-percorso { font-family:var(--font-mono); font-size:10px; letter-spacing:0.05em; color:var(--text-tertiary); height:14px; text-align:center; }

#bar-right {
  padding:0 20px; display:flex; align-items:center; justify-content:flex-end;
  gap:18px; height:100%; border-left:1px solid var(--border);
}
.legenda-item { display:flex; align-items:center; gap:7px; font-family:var(--font-mono); font-size:10px; letter-spacing:0.05em; text-transform:uppercase; color:var(--text-secondary); white-space:nowrap; }
.legenda-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; border:1.5px solid rgba(255,255,255,0.85); box-shadow:0 1px 4px rgba(0,0,0,0.18); }

/* ── CONTROLS PANEL (bottom-right) ── */
#ctrl-panel {
  position:fixed; bottom:20px; right:16px; z-index:150;
  display:flex; flex-direction:column; gap:6px; align-items:flex-end;
}
.ctrl-group {
  background:rgba(245,243,238,0.95); backdrop-filter:blur(12px);
  border:1px solid var(--border-strong); border-radius:var(--radius-sm);
  overflow:hidden; box-shadow:0 2px 12px rgba(0,0,0,0.1);
  display:flex; flex-direction:column;
}
.ctrl-btn {
  width:36px; height:36px; border:none; background:transparent; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-size:14px; color:var(--text-primary);
  transition:background var(--transition); position:relative;
}
.ctrl-btn:not(:last-child) { border-bottom:1px solid var(--border); }
.ctrl-btn:hover { background:rgba(0,0,0,0.05); }
.ctrl-btn.active { background:rgba(0,0,0,0.08); color:#1A1A1A; }
.ctrl-btn svg { pointer-events:none; }
.ctrl-tooltip {
  position:absolute; right:calc(100% + 8px); top:50%; transform:translateY(-50%);
  background:var(--text-primary); color:white;
  font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.05em;
  padding:3px 7px; border-radius:4px; white-space:nowrap;
  opacity:0; pointer-events:none; transition:opacity 0.15s;
}
.ctrl-btn:hover .ctrl-tooltip { opacity:1; }

/* Zoom label */
#zoom-label {
  background:rgba(245,243,238,0.95); backdrop-filter:blur(12px);
  border:1px solid var(--border-strong); border-radius:var(--radius-sm);
  padding:5px 10px; font-family:var(--font-mono); font-size:10px;
  letter-spacing:0.06em; color:var(--text-secondary);
  box-shadow:0 2px 8px rgba(0,0,0,0.08); text-align:center; min-width:60px;
}

/* ── MUNICIPI LEGEND (bottom-left) ── */
#municipi-panel {
  position:fixed; bottom:20px; left:16px; z-index:150;
  background:rgba(245,243,238,0.95); backdrop-filter:blur(12px);
  border:1px solid var(--border-strong); border-radius:var(--radius-sm);
  box-shadow:0 2px 12px rgba(0,0,0,0.1);
  padding:10px 12px; display:none; flex-direction:column; gap:6px;
}
#municipi-panel.visible { display:flex; }
.municipi-header { font-family:var(--font-mono); font-size:9px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-tertiary); margin-bottom:2px; }
.municipi-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; }
.mun-btn {
  padding:4px 6px; border-radius:5px; border:1px solid var(--border);
  background:var(--surface); font-family:var(--font-mono); font-size:10px;
  letter-spacing:0.04em; color:var(--text-secondary); cursor:pointer;
  transition:all var(--transition); text-align:center;
}
.mun-btn:hover { background:var(--bg); border-color:var(--border-strong); color:var(--text-primary); }
.mun-btn.active { background:var(--text-primary); color:var(--surface); border-color:var(--text-primary); }
.mun-btn.all { grid-column:1/-1; color:var(--text-tertiary); }
.mun-btn.all.active { background:var(--bg); color:var(--text-secondary); border-color:var(--border-strong); }

/* ── MAPBOX overrides ── */
.mapboxgl-ctrl-top-right { display:none !important; }
.mapboxgl-ctrl-bottom-right { display:none !important; }
.mapboxgl-ctrl-bottom-left { display:none !important; }
.mapboxgl-popup { z-index:300; }
.mapboxgl-popup-content {
  padding:0; border-radius:var(--radius-md); box-shadow:var(--shadow-lg);
  border:1px solid rgba(0,0,0,0.09); overflow:hidden; width:300px; background:var(--surface);
}
.mapboxgl-popup-close-button {
  font-size:18px; color:var(--text-secondary); width:32px; height:32px;
  top:8px; right:8px; border-radius:50%; display:flex; align-items:center;
  justify-content:center; z-index:2;
}
.mapboxgl-popup-close-button:hover { background:var(--bg); }
.mapboxgl-popup-tip { display:none; }

/* ── POPUP ── */
.popup-macro-bar { height:4px; width:100%; }
.popup-body { padding:15px 16px 12px; }
.popup-tipo { font-family:var(--font-mono); font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-tertiary); margin-bottom:4px; }
.popup-name { font-family:var(--font-display); font-size:15px; line-height:1.3; color:var(--text-primary); margin-bottom:10px; }
.popup-address { font-size:12px; color:var(--text-secondary); line-height:1.5; margin-bottom:11px; display:flex; gap:5px; align-items:flex-start; }
.popup-address svg { flex-shrink:0; margin-top:1px; }
.popup-percorsi { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:11px; }
.popup-percorso-tag { font-family:var(--font-mono); font-size:10px; letter-spacing:0.04em; padding:3px 8px; border-radius:100px; background:var(--bg); color:var(--text-secondary); border:1px solid rgba(0,0,0,0.08); }
.popup-desc { font-size:12.5px; line-height:1.55; color:var(--text-secondary); }
.popup-desc.collapsed { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.popup-expand { background:none; border:none; font-family:var(--font-mono); font-size:10px; letter-spacing:0.06em; color:var(--text-tertiary); cursor:pointer; padding:4px 0 0; display:flex; align-items:center; gap:4px; margin-top:5px; }
.popup-expand:hover { color:var(--text-primary); }
.popup-cta { display:flex; align-items:center; justify-content:space-between; width:100%; padding:11px 14px; border:none; border-top:1px solid rgba(0,0,0,0.07); background:var(--bg); font-family:var(--font-body); font-size:12.5px; font-weight:500; color:var(--text-primary); cursor:pointer; transition:background var(--transition); margin-top:10px; border-radius:0 0 var(--radius-md) var(--radius-md); }
.popup-cta:hover { background:#EDEBE5; }
.popup-cta svg { opacity:0.5; }

/* ── MARKERS ── */
.marker-outer { width:18px; height:18px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.marker-dot { width:13px; height:13px; border-radius:50%; border:2.5px solid rgba(255,255,255,0.92); box-shadow:0 2px 8px rgba(0,0,0,0.28); transition:transform 0.18s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.18s ease, background 0.18s ease; will-change:transform; }
.marker-outer:hover .marker-dot { transform:scale(1.45); box-shadow:0 4px 14px rgba(0,0,0,0.32); }
.marker-outer.active .marker-dot { transform:scale(1.6); box-shadow:0 5px 18px rgba(0,0,0,0.35); }
.marker-dot.sanitario      { background:var(--c-sanitario); }
.marker-dot.sociosanitario { background:var(--c-sociosanitario); }
.marker-dot.sociale        { background:var(--c-sociale); }
.marker-dot.locale         { background:var(--c-locale); }
.marker-outer.dimmed .marker-dot { background:#C4C1BA !important; box-shadow:0 1px 4px rgba(0,0,0,0.10); border-color:rgba(255,255,255,0.5); transform:none !important; }
</style>

// ── Markers ──
function createMarker(node) {
  const el = document.createElement('div');
  el.className = 'marker-outer';
  el.innerHTML = `<div class="marker-dot ${node.macro}"></div>`;
  el.dataset.id = node.id;

  el.addEventListener('click', (e) => { e.stopPropagation(); handleMarkerClick(node, el); });

  const marker = new mapboxgl.Marker({ element: el, anchor: 'center' })
    .setLngLat([node.lon, node.lat])
    .addTo(map);
  markers[node.id] = { marker, el, node };
}

// ── Popup ──
function handleMarkerClick(node, el) {
  stopOrbit();
  if (currentPopup) { currentPopup.remove(); currentPopup = null; }
  if (activeMarkerId) { const p = markers[activeMarkerId]; if (p) p.el.classList.remove('active'); }
  activeMarkerId = node.id;
  el.classList.add('active');

  const color   = MACRO_COLORS[node.macro];
  const firstP  = node.percorsi[0];
  const descText = firstP ? firstP.desc : '—';
  const percorsiTags = node.percorsi.map(p => `<span class="popup-percorso-tag">${p.id}</span>`).join('');

  const popupHTML = `
    <div class="popup-card">
      <div class="popup-macro-bar" style="background:${color}"></div>
      <div class="popup-body">
        <div class="popup-tipo">${node.tipo}</div>
        <div class="popup-name">${node.name}</div>
        <div class="popup-address">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <circle cx="6" cy="5" r="2.5" stroke="currentColor" stroke-width="1.2"/>
            <path d="M6 1C3.791 1 2 2.791 2 5c0 3 4 7 4 7s4-4 4-7c0-2.209-1.791-4-4-4z" stroke="currentColor" stroke-width="1.2" fill="none"/>
          </svg>
          ${node.indirizzo || '—'}
        </div>
        ${percorsiTags ? `<div class="popup-percorsi">${percorsiTags}</div>` : ''}
        <div class="popup-desc collapsed" id="popup-desc-${node.id}">${descText}</div>
        ${node.percorsi.length ? `<button class="popup-expand" onclick="togglePopupDesc('${node.id}')">
          <span id="popup-expand-label-${node.id}">Leggi di più</span>
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path id="popup-expand-chevron-${node.id}" d="M2 3.5l3 3 3-3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>` : ''}
      </div>
      <button class="popup-cta" onclick="openScheda('${node.id}')">
        Apri scheda completa
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 7h8M8 4l3 3-3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>`;

  currentPopup = new mapboxgl.Popup({ closeButton:true, closeOnClick:false, offset:[0,-10], maxWidth:'300px' })
    .setLngLat([node.lon, node.lat])
    .setHTML(popupHTML)
    .addTo(map);

  currentPopup.on('close', () => {
    el.classList.remove('active');
    if (activeMarkerId === node.id) activeMarkerId = null;
    stopOrbit();
  });

  // Fly to marker, then if 3D start orbit
  map.flyTo({
    center: [node.lon, node.lat],
    zoom: is3D ? 15.5 : Math.max(map.getZoom(), 13),
    pitch: is3D ? 52 : map.getPitch(),
    duration: 900,
    essential: true,
  });

  if (is3D) {
    setTimeout(startOrbit, 1000);
  }
}

// ── Orbit camera ──
function startOrbit() {
  stopOrbit();
  const center = map.getCenter();
  let bearing = map.getBearing();
  orbitInterval = setInterval(() => {
    bearing = (bearing + 0.4) % 360;
    map.easeTo({ bearing, duration: 100, easing: t => t });
  }, 100);
}
function stopOrbit() {
  if (orbitInterval) { clearInterval(orbitInterval); orbitInterval = null; }
}

// ── Toggle popup desc ──
function togglePopupDesc(id) {
  const desc  = document.getElementById(`popup-desc-${id}`);
  const label = document.getElementById(`popup-expand-label-${id}`);
  const chev  = document.getElementById(`popup-expand-chevron-${id}`);
  if (!desc) return;
  const collapsed = desc.classList.toggle('collapsed');
  if (label) label.textContent = collapsed ? 'Leggi di più' : 'Mostra meno';
  if (chev)  chev.setAttribute('d', collapsed ? 'M2 3.5l3 3 3-3' : 'M2 6.5l3-3 3 3');
}

function openScheda(id) {
  const n = DATASET.find(d => d.id === id);
  if (!n) return;
  alert(`${n.name}\n${n.indirizzo}\n\nPercorsi: ${n.percorsi.map(p=>p.id).join(', ')}`);
}

// ── 2D / 3D views ──
function setView2D() {
  is3D = false;
  stopOrbit();
  map.easeTo({ pitch:0, bearing:0, duration:700 });
  map.setPaintProperty('building-extrusions', 'fill-extrusion-opacity', 0);
  document.getElementById('btn-2d').classList.add('active');
  document.getElementById('btn-3d').classList.remove('active');
}
function setView3D() {
  is3D = true;
  map.easeTo({ pitch:52, bearing:-15, zoom:Math.max(map.getZoom(), 13), duration:900 });
  map.setPaintProperty('building-extrusions', 'fill-extrusion-opacity', 0.65);
  document.getElementById('btn-3d').classList.add('active');
  document.getElementById('btn-2d').classList.remove('active');
}

// ── Reset north ──
function resetNorth() {
  stopOrbit();
  map.easeTo({ bearing:0, pitch: is3D ? 52 : 0, duration:500 });
}

// ── Fit Milan ──
function fitMilan() {
  stopOrbit();
  if (currentPopup) { currentPopup.remove(); currentPopup = null; }
  if (activeMarkerId) { const p = markers[activeMarkerId]; if (p) p.el.classList.remove('active'); activeMarkerId = null; }
  map.flyTo({ center:[9.19, 45.4654], zoom:11.5, pitch:0, bearing:0, duration:1000 });
}

// ── Percorso filter ──
document.getElementById('percorso-select').addEventListener('change', function() {
  activePercorso = this.value || null;
  applyFilter();
});

function applyFilter() {
  let visible = 0;
  Object.values(markers).forEach(({ el, node }) => {
    const matchP = !activePercorso || node.percorsi.some(p => p.id === activePercorso);
    const matchM = !activeMunicipio || munContains(activeMunicipio, node.lat, node.lon);
    const show = matchP && matchM;
    el.classList.toggle('dimmed', !show);
    if (show) visible++;
  });

  const countEl = document.getElementById('bar-count-percorso');
  if (activePercorso || activeMunicipio) {
    let label = `${visible} attori visibili`;
    if (activePercorso) label += ` · ${activePercorso}`;
    if (activeMunicipio) label += ` · Mun. ${activeMunicipio}`;
    countEl.textContent = label;
  } else {
    countEl.innerHTML = '&nbsp;';
  }

  if (activeMarkerId) {
    const a = markers[activeMarkerId];
    if (a && a.el.classList.contains('dimmed')) {
      if (currentPopup) { currentPopup.remove(); currentPopup = null; }
      activeMarkerId = null;
      stopOrbit();
    }
  }
}

// ── Municipio filter ──
function toggleMunicipiPanel() {
  const panel = document.getElementById('municipi-panel');
  const btn   = document.getElementById('btn-municipi');
  panel.classList.toggle('visible');
  btn.classList.toggle('active');

  // Show/hide GeoJSON overlay
  const visible = panel.classList.contains('visible');
  const opacity = visible ? 0.06 : 0;
  const lineOp  = visible ? 0.35 : 0;
  const textOp  = visible ? 0.8  : 0;
  map.setPaintProperty('municipi-fill', 'fill-opacity', opacity);
  map.setPaintProperty('municipi-line', 'line-opacity', lineOp);
  map.setPaintProperty('municipi-label', 'text-opacity', textOp);
  if (visible) {
    map.setLayoutProperty('municipi-label', 'visibility', 'visible');
  } else {
    map.setLayoutProperty('municipi-label', 'visibility', 'none');
    filterMunicipio(null);
  }
}

function filterMunicipio(id) {
  activeMunicipio = id;
  // Update button states
  document.querySelectorAll('.mun-btn').forEach(btn => btn.classList.remove('active'));
  if (id === null) {
    document.querySelector('.mun-btn.all').classList.add('active');
    // Reset fill highlights
    map.setPaintProperty('municipi-fill', 'fill-color', '#1A1A1A');
    map.setPaintProperty('municipi-fill', 'fill-opacity', 0.06);
  } else {
    document.querySelector(`[onclick="filterMunicipio(${id})"]`).classList.add('active');
    // Highlight selected, dim others
    map.setPaintProperty('municipi-fill', 'fill-color', [
      'case', ['==', ['get', 'id'], id], '#1A1A1A', '#1A1A1A'
    ]);
    map.setPaintProperty('municipi-fill', 'fill-opacity', [
      'case', ['==', ['get', 'id'], id], 0.08, 0.20
    ]);
    // Fly to municipio center
    const center = MUNICIPI_CENTERS[id];
    if (center) map.flyTo({ center, zoom:13, duration:800, pitch: is3D ? 52 : 0 });
  }
  applyFilter();
}

// Point-in-bounding-box check for municipio (approximate)
function munContains(id, lat, lon) {
  const feat = MUNICIPI_GEOJSON.features.find(f => f.properties.id === id);
  if (!feat) return true;
  const coords = feat.geometry.coordinates[0];
  const lons = coords.map(c => c[0]);
  const lats = coords.map(c => c[1]);
  const minLon = Math.min(...lons), maxLon = Math.max(...lons);
  const minLat = Math.min(...lats), maxLat = Math.max(...lats);
  return lon >= minLon && lon <= maxLon && lat >= minLat && lat <= maxLat;
}

// ── Map click: close popup ──
map.on('click', (e) => {
  try {
    const features = map.queryRenderedFeatures(e.point, { layers: ['municipi-fill'] });
    if (features.length) return;
  } catch(err) { /* layer not yet ready */ }
  if (currentPopup) { currentPopup.remove(); currentPopup = null; stopOrbit(); }
  if (activeMarkerId) { const p = markers[activeMarkerId]; if (p) p.el.classList.remove('active'); activeMarkerId = null; }
});

  }
}
